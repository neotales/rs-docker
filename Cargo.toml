[workspace]
resolver = "3"
members = ["bake", "buildkit", "compose", "engine", "oci"]
# Every member is a default member, so a bare `cargo build` or `cargo test` at
# the root reaches every shippable crate without `--workspace`. CI passes
# `--workspace` anyway; this is a convenience for a developer, not the contract.
default-members = ["bake", "buildkit", "compose", "engine", "oci"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-docker"
authors = ["x0craft"]

[workspace.dependencies]
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1.3", features = ["client", "http1"] }
hyper-util = { version = "0.1.5", features = ["client-legacy", "http1", "tokio"] }
indexmap = { version = "2.12", features = ["serde"] }
rcgen = { version = "0.14.7", features = ["zeroize", "x509-parser"] }
rsa = "0.9.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.24"
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower-service = "0.3"
url = "2.5"
zip = { version = "9", default-features = false, features = ["deflate"] }
# 1.9.1 redacts `Zeroizing`'s Debug output. The imported crates were tested
# against 1.9.0, which prints the wrapped secret. Do not float this until those
# hand-written Debug impls are revisited.
zeroize = { version = "=1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
