[package]
name = "neotales-docker-buildkit"
description = "Explicit BuildKit builder and solve contracts with a fixture adapter"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
# The repository root holds the licence and the style guide. A package only
# ships files under its own directory, so list the file set explicitly and
# include LICENSE.md; cargo package accepts that licence file with the SPDX
# `license` field above.
include = ["/Cargo.toml", "/README.md", "/LICENSE.md", "/src/**", "/tests/**", "/docs/**"]
keywords = ["buildkit", "docker", "build", "oci", "llb"]
categories = ["compilers", "network-programming"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[lints]
workspace = true
