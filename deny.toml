# Supply chain policy for this workspace.
#
# A workspace has one lockfile and one dependency graph, so it has one policy.
# Every crate in this repository is in scope; `all-features` below means a
# dependency reached only through an optional feature is still checked.
#
# If a crate here needs an advisory ignore, add it with a reason and a delete
# condition, and never as a way to make a red build green. `cargo audit` reads
# no config file, so the same ignore must also be repeated in audit.yml as an
# `--ignore` flag. Two places, one reason: the reason and the delete condition
# live here, next to the graph they were reasoned about.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "transitive"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = """\
    Marvin attack timing side channel in rsa 0.9 private-key decryption. No     patched 0.9 release exists. neotales-ssh, reached through the engine's     optional `ssh` feature, uses rsa for host-key signatures and key parsing,     not for that decrypt path. This is not a mitigation. Delete this entry when     rsa leaves the graph or moves to a patched line.""" },
  { id = "RUSTSEC-2024-0449", reason = """\
    unsafe-libyaml is unmaintained and no patched release exists.     neotales-docker-compose uses serde_yaml 0.9, and its YAML surface and     fixtures were written against that parser; replacing it is a change of its     own. This is not a mitigation. Delete this entry when that parser leaves     the graph.""" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
