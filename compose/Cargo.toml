[package]
name = "neotales-docker-compose"
description = "Explicit, daemon-free Compose document and resolution primitives"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["docker", "compose", "yaml", "oci", "config"]
categories = ["config", "parser-implementations"]

[features]
default = []
templates = ["dep:neotales-gotmpl", "dep:neotales-sprig"]

[dependencies]
# The dotenv, environment, template engine and helper set are separate crates
# with their own repositories. Each is named by the version on crates.io: the
# source checkout this crate was imported from resolved them by path, and a
# path that leaves this repository cannot be published.
neotales-dotenv = "0.0.0-alpha.1"
neotales-env = "0.0.0-alpha.1"
neotales-gotmpl = { version = "0.0.0-alpha.0", optional = true }
neotales-sprig = { version = "0.0.0-alpha.0", optional = true }
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true

[dev-dependencies]
neotales-sprig = "0.0.0-alpha.0"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

# These exercise the template and values boundary, which only exists with the
# `templates` feature. Declaring it here means `cargo test -p
# neotales-docker-compose` skips them rather than failing to resolve their
# imports, instead of the targets only compiling because a workspace build
# happened to unify the feature on from another crate.
[[test]]
name = "templates"
required-features = ["templates"]

[[test]]
name = "values"
required-features = ["templates"]

[lints]
workspace = true
