[package]
name = "neotales-oci-distribution"
description = "Transport-neutral OCI Distribution reference parsing, content digests, media-type negotiation and registry credential policy"
version = "0.0.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
# The repository root holds the licence and the style guide. A package only
# ships files under its own directory, so list the file set explicitly and
# include LICENSE.md; cargo package accepts that licence file with the SPDX
# `license` field above.
include = ["/Cargo.toml", "/README.md", "/LICENSE.md", "/src/**", "/tests/**", "/docs/**"]
keywords = ["oci", "registry", "container", "digest", "distribution"]
# Slugs from the registry's category index: the top-level list at
# `https://crates.io/api/v1/categories` plus each entry's `subcategories`.
# `container-tools` is not a slug at all, and `web-programming::http` is not
# one of that category's children (`http-client`, `http-server`, `websocket`),
# so crates.io rejects either at upload. The registry protocol is the crate's
# subject, reference and digest parsing is how it reads a reference, and the
# digests and credential policy are the cryptographic part.
categories = ["network-programming", "parser-implementations", "cryptography"]

[dependencies]
base64.workspace = true
sha2.workspace = true
url.workspace = true
zeroize.workspace = true

[lints]
workspace = true
