[package]
name = "neotales-oci-distribution"
description = "Transport-neutral OCI Distribution reference parsing, content digests, media-type negotiation and registry credential policy"
version = "0.0.0-alpha.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
# The repository root holds the licence and the style guide. A package only
# ships files under its own directory, so list the file set explicitly and
# include LICENSE.md; cargo package accepts that licence file with the SPDX
# `license` field above.
include = ["/Cargo.toml", "/README.md", "/LICENSE.md", "/src/**", "/tests/**", "/docs/**"]
keywords = ["oci", "registry", "container", "digest", "distribution"]
categories = ["container-tools", "cryptography", "web-programming::http"]

[dependencies]
base64.workspace = true
sha2.workspace = true
url.workspace = true
zeroize.workspace = true

[lints]
workspace = true
