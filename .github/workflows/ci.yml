name: ci

# One repository, a virtual workspace with five crates: `bake/` is
# `neotales-docker-bake`, `buildkit/` is `neotales-docker-buildkit`, `compose/`
# is `neotales-docker-compose`, `engine/` is `neotales-docker`, and `oci/` is
# `neotales-oci-distribution`. All five are shippable, so every cargo command
# that formats, lints, tests or documents them passes `--workspace`.
# `default-members` is a convenience for a developer's bare `cargo test`; a
# later edit to it must not be able to hide a crate from CI. `--all-targets`
# does not run doctests, so each job that runs tests runs a `--doc` pass as
# well.
#
# `--all-features` enables every feature at once: `templates` on bake and
# compose, `ssh` and `tls` on the engine.
#
# Where the steps run, and why they are not identical on every platform:
#
# - Format, Clippy, both doctest passes and the documentation build run on all
#   three platforms. Clippy is `--all-targets`, so it type-checks every
#   integration test for that platform even where the tests are not run; that
#   is what catches a `cfg(unix)` item going dead on Windows.
# - The test suite runs on all three platforms. The engine's SSH pressure
#   fixtures are the one exception: they fill a loopback socket until a write
#   returns `WouldBlock`, and macOS reaches `EAGAIN` inside the SSH client
#   instead of on the fixture socket. Those tests carry an explicit
#   `cfg_attr(not(target_os = "linux"), ignore = ...)` rather than a
#   whole-engine skip, and the report step below lists every ignored test on
#   macOS and Windows. Everything else, including the daemon-free loopback
#   HTTP suites, runs everywhere.

on:
  push:
    # Every branch, not only the default one: a branch filter hides a failure
    # until the work lands. No path filter either, because a change to a README
    # can still be the change that breaks the build.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      # A skip is a result, not a silence. On macOS and Windows this lists the
      # tests marked ignored, including the Linux-only SSH pressure fixtures;
      # the Linux job has no platform ignore and lists only the opt-in suites.
      - name: Report ignored tests
        shell: bash
        run: cargo test --workspace --all-targets --all-features -- --ignored --list

      # Separate from the test step above, because `--all-targets` selects the
      # unit, integration, example and benchmark targets and not doctests.
      - name: Doctests
        run: cargo test --workspace --doc --all-features

      # The default feature set again, without `--all-features`: the docs have
      # to build for a caller who takes the crate as published, and a doctest
      # that only compiles because another crate in the workspace turned a
      # feature on is not evidence for that caller.
      - name: Doctests with the default features
        run: cargo test --workspace --doc

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs 1.100.0, the channel in rust-toolchain.toml and the minimum
      # supported version declared in each member's Cargo.toml. Do not float to
      # stable here: a job named msrv that tests stable proves nothing.
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: msrv

      # Every workspace member must declare the same minimum, not just the
      # first package cargo happens to list.
      - name: Check the declared minimum Rust version
        run: |
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 - <<'PY'
          import json
          import sys

          with open("metadata.json", encoding="utf-8") as handle:
              packages = json.load(handle)["packages"]

          if not packages:
              sys.exit("cargo metadata listed no packages")

          failed = False
          for package in packages:
              declared = package.get("rust_version") or ""
              print(f"{package['name']}: rust-version {declared or '<unset>'}")
              if declared != "1.100":
                  print(
                      f"::error::{package['name']} must declare "
                      f'rust-version = "1.100", found {declared or "<unset>"}.'
                  )
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Test on the minimum supported Rust version
        run: cargo test --workspace --all-targets --all-features

      # The same split as the matrix job: `--all-targets` does not include
      # doctests, and a doctest that uses a newer API breaks the declared
      # minimum just as a unit test does.
      - name: Doctests on the minimum supported Rust version
        run: cargo test --workspace --doc --all-features
